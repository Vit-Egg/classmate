<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classmate</title>
<style>
  :root { color-scheme: light dark; --bg: light-dark(#f4f2ee, #0f1013); --text: light-dark(#16181b, #f1f2f4); --muted: light-dark(#6b6f76, #8d939c); --btn: light-dark(#15181b, #eeeff1); --btn-ink: light-dark(#ffffff, #14161a); }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, sans-serif; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 360px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  .alt { margin: 22px 0 0; }
  a.link { background: none; color: var(--muted); padding: 6px; font-weight: 500; text-decoration: underline; }
  a { display: inline-block; background: var(--btn); color: var(--btn-ink); text-decoration: none; font-weight: 600; padding: 12px 22px; border-radius: 14px; }
</style>
</head>
<body>
<main>
  <h1>Classmate se nenačetl</h1>
  <p>Zkontroluj připojení k internetu a zkus to znovu.</p>
  <a href="__URL__">Zkusit znovu</a>
  <p class="alt"><a class="link" href="classmate-app://server">Změnit server</a></p>
</main>
</body>
</html>
