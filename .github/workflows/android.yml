# Kontrola Android aplikace: sestaví ladicí APK a spustí lint. APK je ke stažení v artefaktech běhu.
name: Android

on:
  push:
    branches: [main]
    paths: ["classmate-app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["classmate-app/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classmate-app/android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # číslo verze = počet commitů
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: classmate-debug-apk
          path: classmate-app/android/app/build/outputs/apk/debug/*.apk
