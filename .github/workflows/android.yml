# Kontrola Android aplikace: sestaví ladicí APK a spustí lint. APK je ke stažení v artefaktech běhu.
# Zatím jen ručně: ve zdrojích chybí balíček cz.classmate.app.data (Store, Snapshot), který veřejný archiv vynechal.
# Až bude doplněný, vrať sem spouštění při push a pull_request.
name: Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classmate-app/android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # číslo verze = počet commitů
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: classmate-debug-apk
          path: classmate-app/android/app/build/outputs/apk/debug/*.apk
